<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure P2P Gallery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#0f172a;--card:#1e293b;--primary:#38bdf8;--muted:#94a3b8;--danger:#ef4444;--ok:#4ade80;--gold:#fbbf24}
body{background:var(--bg);color:#f1f5f9;font-family:Segoe UI,Tahoma,sans-serif;text-align:center;margin:0;padding:20px}
h2{color:var(--primary);letter-spacing:3px;text-transform:uppercase}
#status{color:var(--muted);min-height:22px}
#storageInfo{color:var(--muted);font-size:12px}
.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px auto;max-width:1150px;background:#1e293b88;padding:15px;border-radius:30px}
.btn{padding:10px 16px;border:0;border-radius:22px;font-weight:600;cursor:pointer;text-decoration:none;color:#fff;background:#334155}
.btn:hover{filter:brightness(1.15)}.btn-primary{background:linear-gradient(135deg,#38bdf8,#0284c7)}.btn-cloud{background:linear-gradient(135deg,#64748b,#334155)}.btn-danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}.btn-video{background:linear-gradient(135deg,#a855f7,#6d28d9)}

.gallery-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;max-width:1200px;margin:auto}
.gallery-item{position:relative;overflow:hidden;border-radius:15px;border:2px solid #1e293b;aspect-ratio:1;cursor:pointer;background:#111827}.gallery-item:hover{border-color:var(--primary)}
.gallery-img{width:100%;height:100%;object-fit:cover}.gallery-item video{background:#020617}.source-badge{position:absolute;left:7px;bottom:7px;background:#0f172acc;border-radius:12px;padding:4px 8px;font-size:11px}.type-badge{position:absolute;right:7px;bottom:7px;background:#0f172acc;border-radius:12px;padding:4px 8px;font-size:11px;color:var(--gold)}
.delete-item{position:absolute;right:7px;top:7px;border:0;border-radius:50%;width:32px;height:32px;background:#ef4444dd;color:#fff;cursor:pointer;z-index:2}.delete-item:hover{background:#dc2626}
.modal{display:none;position:fixed;z-index:10;inset:0;background:#000e;padding-top:5vh}.modal-content{max-width:90%;max-height:78vh}.close{position:absolute;right:30px;top:15px;font-size:42px;cursor:pointer}.modal-actions{margin-top:18px;display:flex;justify-content:center;gap:12px}
</style>
</head>
<body>
<h2><i class="fas fa-shield-halved"></i> Secure Gallery</h2>
<p id="status">Preparing live gallery…</p>
<p id="storageInfo"></p>
<div class="controls">
  <a href="index.html" class="btn">Home</a>
  <button class="btn btn-primary" onclick="syncP2P('images',false)"><i class="fas fa-images"></i> P2P Photos (All)</button>
  <button class="btn" onclick="loadMoreP2P('images')">More P2P Photos</button>
  <button class="btn btn-cloud" onclick="requestCloudinarySync('images')"><i class="fas fa-cloud-upload-alt"></i> Save Photos Cloudinary</button>
  <button class="btn btn-cloud" onclick="requestCloudinarySync('videos')"><i class="fas fa-cloud-upload-alt"></i> Save Videos Cloudinary</button>
  <button class="btn" onclick="loadFallback('images',false)"><i class="fas fa-cloud-download-alt"></i> Load Cloud Photos</button>
  <button class="btn" onclick="loadMoreCloud('images')">More Cloud Photos</button>
  <button class="btn" onclick="loadFallback('videos',false)"><i class="fas fa-cloud-download-alt"></i> Load Cloud Videos</button>
  <button class="btn" onclick="loadMoreCloud('videos')">More Cloud Videos</button>
  <button class="btn" onclick="refreshGallery()"><i class="fas fa-sync-alt"></i> Refresh</button>
  <button class="btn" onclick="showAllMedia()">Show All Loaded</button>
  <button class="btn btn-danger" onclick="resetGalleryHistory()"><i class="fas fa-trash-restore"></i> Reset Cache</button>
</div>
<div id="gallery" class="gallery-container"></div>
<div id="myModal" class="modal"><span class="close" onclick="closeModal()">&times;</span><div id="modalMedia"></div><div class="modal-actions"><a id="downloadLink" class="btn btn-primary" download>Download</a><button class="btn" onclick="closeModal()">Close</button></div></div>
<script src="socket.io.min.js"></script>
<script>
const BASE_URL='https://webrtc-screen.onrender.com';
const deviceId=new URLSearchParams(location.search).get('id');
let socket=null,pc=null,dc=null,requestId=null,activeMediaType='images',currentFilter='all';
let allPhotos=[],currentFile=null,manifestById={},dbPromise=null,pendingDelete=null,fallbackTimer=null,autoSyncStage='idle',completedRequestId=null;
let nextCursorByType={images:null,videos:null},p2pPageByType={images:0,videos:0},pendingCandidates=[],queuedP2P=null,relayMode=false;
function setStatus(text,color){const el=document.getElementById('status');el.textContent=text;el.style.color=color||'var(--muted)'}
function debug(text,data){console.log('[Gallery]',text,data===undefined?'':data)}
function normalizeType(type){return type==='videos'?'videos':'images'}
function itemType(item){return item&&((item.type==='video')||String(item.mime||'').startsWith('video/'))?'videos':'images'}
function formatBytes(bytes){if(!Number.isFinite(bytes)||bytes<=0)return '0 B';const u=['B','KB','MB','GB','TB'];const i=Math.min(Math.floor(Math.log(bytes)/Math.log(1024)),u.length-1);return (bytes/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]}
async function updateStorageInfo(){try{if(!navigator.storage||!navigator.storage.estimate)return;const e=await navigator.storage.estimate();const el=document.getElementById('storageInfo');if(el)el.textContent='Parent browser cache: '+formatBytes(Number(e.usage||0))+' used / '+formatBytes(Number(e.quota||0))+' available quota'}catch(e){debug('storage estimate failed',e.message)}}
async function requestPersistentStorage(){try{if(navigator.storage&&navigator.storage.persist){const ok=await navigator.storage.persist();debug('persistent storage request',ok)}}catch(e){debug('persistent storage request failed',e.message)}}
function openDb(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('parents-control-gallery',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('items'))r.result.createObjectStore('items',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return dbPromise}
async function dbPut(item){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').put(item);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB write failed',e.message);setStatus('Browser cache full; use Download or Cloudinary','var(--danger)')}}
async function dbGetAll(){try{const db=await openDb();return await new Promise((res,rej)=>{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>rej(q.error)})}catch(e){debug('IndexedDB read failed',e.message);return []}}
async function dbDelete(id){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB delete failed',e.message)}}
async function dbClear(){try{const db=await openDb();await new Promise((res,rej)=>{const tx=db.transaction('items','readwrite');tx.objectStore('items').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});updateStorageInfo()}catch(e){debug('IndexedDB clear failed',e.message)}}
function closePeer(){try{if(dc)dc.close()}catch(e){}try{if(pc)pc.close()}catch(e){}dc=null;pc=null}
function initSocket(){if(socket||!deviceId)return;debug('opening Socket.IO connection',{deviceId});socket=io(BASE_URL,{transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>{debug('socket connected',{socketId:socket.id,type:activeMediaType});socket.emit('join-room',deviceId);socket.emit('join',deviceId);if(queuedP2P){const queued=queuedP2P;queuedP2P=null;setTimeout(()=>requestP2P(queued.type,queued.offset),250)}else if(autoSyncStage==='images'&&!requestId)requestP2P('images',0)});socket.on('connect_error',e=>{debug('socket connect error',e.message);setStatus('Signaling connection failed','var(--danger)')});socket.on('disconnect',reason=>debug('socket disconnected',reason));socket.on('gallery-offer',receiveOffer);socket.on('gallery-candidate',d=>{if(!d||d.requestId!==requestId||!d.candidate)return;if(!pc||!pc.remoteDescription){pendingCandidates.push(d.candidate);debug('ICE candidate queued until peer offer is ready');return}pc.addIceCandidate(d.candidate).then(()=>debug('ICE candidate added')).catch(e=>debug('ICE candidate failed',e.message))});socket.on('gallery-error',d=>{debug('gallery signaling error',d);if(d&&d.requestId===requestId)triggerFallback(activeMediaType,'server error')});socket.on('gallery-fallback-complete',d=>{debug('Cloudinary save complete',d);const t=normalizeType(d&&d.mediaType||activeMediaType||'images');setStatus('Cloudinary saved '+(d&&d.uploaded!=null?d.uploaded:'')+' '+(t==='videos'?'videos':'photos')+' — loading…','var(--ok)');loadFallback(t,false)});socket.on('gallery-delete-ack',d=>{debug('delete acknowledgement',d);if(!pendingDelete)return;if((d.requestId&&d.requestId===pendingDelete.requestId)||(!d.requestId&&d.id===pendingDelete.id))pendingDelete.resolve(d)});socket.on('gallery-relay-start',d=>{if(!d||d.requestId!==requestId)return;relayMode=true;clearTimeout(fallbackTimer);debug('relay mode activated',{requestId:d.requestId,type:activeMediaType});setStatus('Receiving '+(activeMediaType==='videos'?'videos':'photos')+' via server relay…','var(--ok)')});socket.on('gallery-relay-manifest',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'manifest',mediaType:d.mediaType,items:d.items})});socket.on('gallery-relay-file-start',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'file-start',id:d.id})});socket.on('gallery-relay-chunk',d=>{if(!d||d.requestId!==requestId||!relayMode||!d.chunk)return;handleRelayChunk(d.chunk)});socket.on('gallery-relay-file-end',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'file-end',id:d.id})});socket.on('gallery-relay-complete',d=>{if(!d||d.requestId!==requestId||!relayMode)return;handleRelayMsg({kind:'gallery-complete'})})}
function requestP2P(type,offset){type=normalizeType(type);if(type==='videos'){setStatus('Videos are Cloudinary-only; P2P video disabled','var(--danger)');debug('P2P videos blocked');return}if(requestId&&!completedRequestId&&(pc||relayMode||(dc&&dc.readyState==='open'))){debug('P2P already in progress, ignoring duplicate',{active:requestId,type});return}if(!socket||!socket.connected){queuedP2P={type,offset:offset||0};debug('P2P request queued until Socket.IO connects',{type,offset:offset||0});setStatus('Waiting for P2P signaling connection…');initSocket();return}activeMediaType=type;currentFilter=type;pendingCandidates=[];completedRequestId=null;relayMode=false;closePeer();requestId=crypto.randomUUID();clearTimeout(fallbackTimer);setStatus('Live P2P photos connecting…');debug('P2P request sent',{requestId,type,offset:offset||0,limit:2000});socket.emit('gallery-request',{target:deviceId,requestId,mediaType:type,offset:offset||0,limit:2000});fallbackTimer=setTimeout(()=>{if(relayMode||(dc&&dc.readyState==='open')||completedRequestId===requestId)return;debug('P2P DataChannel timeout — switching to server relay',{requestId,type});triggerFallback(type,'parent timeout waiting for DataChannel')},18000)}
function triggerFallback(type,reason){clearTimeout(fallbackTimer);closePeer();if(relayMode)return;relayMode=true;debug('P2P failed, entering Socket.IO relay mode',{type,reason});setStatus('P2P blocked by NAT; switching to server relay…');socket.emit('gallery-relay-start',{target:deviceId,requestId,mediaType:type})}
async function receiveOffer(d){if(!d||d.requestId!==requestId){debug('ignored stale offer',d&&d.requestId);return}debug('offer received',{requestId:d.requestId});try{closePeer();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'},{urls:'stun:stun3.l.google.com:19302'},{urls:'stun:stun4.l.google.com:19302'},{urls:'stun:global.stun.twilio.com:3478'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},{urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}],sdpSemantics:'unified-plan'});pc.onicecandidate=e=>{if(e.candidate){debug('sending ICE candidate');socket.emit('gallery-candidate',{targetSocketId:d.senderSocketId,requestId,candidate:e.candidate})}};pc.onconnectionstatechange=()=>{debug('peer connection state',pc.connectionState);if(['failed','closed'].includes(pc.connectionState)&&completedRequestId!==requestId)triggerFallback(activeMediaType,'browser peer state '+pc.connectionState)};pc.ondatachannel=e=>attachChannel(e.channel);await pc.setRemoteDescription({type:'offer',sdp:d.offer.sdp});for(const candidate of pendingCandidates.splice(0)){try{await pc.addIceCandidate(candidate);debug('queued ICE candidate added')}catch(e){debug('queued ICE candidate failed',e.message)}}const answer=await pc.createAnswer();await pc.setLocalDescription(answer);socket.emit('gallery-answer',{targetSocketId:d.senderSocketId,requestId,answer:{type:answer.type,sdp:answer.sdp}});debug('answer sent')}catch(e){debug('offer handling failed',e.message);triggerFallback(activeMediaType,'offer handling failed')}}
function attachChannel(channel){dc=channel;dc.binaryType='arraybuffer';debug('DataChannel attached',{state:channel.readyState});channel.onopen=()=>{clearTimeout(fallbackTimer);debug('DataChannel open');setStatus('Live P2P '+(activeMediaType==='videos'?'video':'photo')+' transfer active','var(--ok)')};channel.onclose=()=>{debug('DataChannel closed');if(autoSyncStage==='idle'&&!allPhotos.length&&completedRequestId!==requestId)triggerFallback(activeMediaType,'channel closed')};channel.onerror=e=>{debug('DataChannel error',e&&e.message||'unknown');triggerFallback(activeMediaType,'channel error')};channel.onmessage=handleData}
function onP2PComplete(){completedRequestId=requestId;debug('Transfer complete',{type:activeMediaType,count:allPhotos.filter(x=>itemType(x)===activeMediaType).length});clearTimeout(fallbackTimer);p2pPageByType[activeMediaType]=(p2pPageByType[activeMediaType]||0)+1;setStatus((relayMode?'Relay':'P2P')+' photos loaded','var(--ok)');relayMode=false;closePeer();autoSyncStage='idle'}
function handleData(ev){if(typeof ev.data==='string'){try{const m=JSON.parse(ev.data);debug('control frame',m.kind);if(m.kind==='manifest'){manifestById={};activeMediaType=normalizeType(m.mediaType||activeMediaType);(m.items||[]).forEach(x=>manifestById[x.id]=x);currentFilter=activeMediaType;setStatus('Receiving '+(activeMediaType==='videos'?'videos':'photos')+(relayMode?' via relay':' over P2P')+'…');debug('manifest received',{type:activeMediaType,count:(m.items||[]).length});renderGallery();return}if(m.kind==='file-start'){const meta=manifestById[m.id]||{};currentFile={...meta,id:m.id,chunks:[]};debug('file start',{id:m.id,name:m.name||meta.name});return}if(m.kind==='file-end'&&currentFile){const blob=new Blob(currentFile.chunks,{type:currentFile.mime||'application/octet-stream'});const old=allPhotos.find(x=>x.id===currentFile.id);if(old&&old.url&&old.source==='p2p')try{URL.revokeObjectURL(old.url)}catch(e){}const item={...currentFile,blob,source:'p2p',url:URL.createObjectURL(blob)};delete item.chunks;allPhotos=allPhotos.filter(x=>x.id!==item.id);allPhotos.push(item);dbPut({id:item.id,name:item.name,mime:item.mime,size:item.size,modifiedAt:item.modifiedAt,source:'p2p',blob});debug('file received',{id:item.id,name:item.name,bytes:blob.size,type:item.mime});renderGallery();currentFile=null;return}if(m.kind==='gallery-complete'){onP2PComplete();return}}catch(e){debug('control frame parse failed',e.message)}return}if(currentFile)currentFile.chunks.push(ev.data)}
function handleRelayMsg(msg){handleData({data:JSON.stringify(msg)})}
function handleRelayChunk(b64){try{const bin=atob(b64);const len=bin.length;const bytes=new Uint8Array(len);for(let i=0;i<len;i++)bytes[i]=bin.charCodeAt(i);handleData({data:bytes.buffer})}catch(e){debug('relay chunk decode failed',e.message)}}
async function loadGallery(type,automatic){type=normalizeType(type);currentFilter=type;autoSyncStage=automatic?'images':'idle';const cached=await dbGetAll();allPhotos=cached.filter(x=>x.blob instanceof Blob);for(const x of allPhotos)x.url=URL.createObjectURL(x.blob);renderGallery();updateStorageInfo();initSocket();activeMediaType=type;if(socket&&socket.connected)requestP2P(type)}
function syncP2P(type,more){type=normalizeType(type);if(type==='videos'){setStatus('Videos are Cloudinary-only (P2P disabled for heavy video)','var(--danger)');return}autoSyncStage='idle';currentFilter=type;const offset=more?(p2pPageByType[type]||0)*2000:0;if(!more)p2pPageByType[type]=0;renderGallery();requestP2P(type,offset)}
function loadMoreP2P(type){type=normalizeType(type);if(type==='videos')return;syncP2P(type,true)}
function refreshGallery(){renderGallery();updateStorageInfo();setStatus('Gallery refreshed — showing whatever is already loaded','var(--ok)');debug('manual refresh')}
function showAllMedia(){currentFilter='all';renderGallery();setStatus('Showing all loaded media; nothing was deleted','var(--ok)')}
function requestCloudinarySync(type){type=normalizeType(type);currentFilter=type;renderGallery();initSocket();if(!socket||!socket.connected)return setStatus('Child device is offline; Cloudinary save request not sent','var(--danger)');const cloudReq=crypto.randomUUID();setStatus('Saving '+(type==='videos'?'videos':'photos')+' to Cloudinary — wait, videos take time…');debug('Cloudinary save request sent',{requestId:cloudReq,type});socket.emit('gallery-fallback-request',{target:deviceId,requestId:cloudReq,mediaType:type});const poll=()=>loadFallback(type,false);setTimeout(poll,20000);setTimeout(poll,60000);setTimeout(poll,120000);setTimeout(poll,180000)}
async function loadFallback(type,more){type=type==='all'?'all':normalizeType(type);if(!deviceId)return;if(!more){if(type!=='all')nextCursorByType[type]=null;currentFilter=type}setStatus('Loading Cloudinary '+(type==='videos'?'videos':'photos')+'…');let url=BASE_URL+'/api/gallery-fallback-list/'+encodeURIComponent(deviceId);const q=[];if(type!=='all')q.push('media_type='+encodeURIComponent(type));const cursor=type==='all'?null:nextCursorByType[type];if(cursor)q.push('next_cursor='+encodeURIComponent(cursor));if(q.length)url+='?'+q.join('&');debug('Cloudinary list request',{type,url});try{const r=await fetch(url);const d=await r.json();for(const item of(d.photos||[])){const existing=allPhotos.find(x=>x.id===item.id);if(!existing)allPhotos.push(item);else if(existing.source!=='p2p'){Object.assign(existing,item)}}if(type!=='all')nextCursorByType[type]=d.next_cursor||null;renderGallery();setStatus('Cloudinary '+(type==='videos'?'videos':'photos')+' loaded; total visible '+allPhotos.filter(x=>type==='all'||itemType(x)===type).length);debug('Cloudinary list response',{type,count:(d.photos||[]).length,nextCursor:type==='all'?null:d.next_cursor||null})}catch(e){debug('Cloudinary list failed',e.message);setStatus('Cloudinary load failed','var(--danger)')}}
function loadMoreCloud(type){type=normalizeType(type);loadFallback(type,true)}
function renderGallery(){const root=document.getElementById('gallery');root.innerHTML='';const list=allPhotos.filter(x=>currentFilter==='all'||itemType(x)===currentFilter).sort((a,b)=>Number(b.modifiedAt||0)-Number(a.modifiedAt||0));for(const item of list){const card=document.createElement('div');card.className='gallery-item';const isVideo=itemType(item)==='videos';const media=isVideo?document.createElement('video'):document.createElement('img');media.className='gallery-img';media.src=item.url;media.loading='lazy';if(isVideo){media.muted=true;media.playsInline=true;media.preload='metadata'}card.onclick=()=>openModal(item);const del=document.createElement('button');del.className='delete-item';del.innerHTML='&times;';del.title='Delete original from child phone';del.onclick=async e=>{e.stopPropagation();await deleteItem(item)};const source=document.createElement('span');source.className='source-badge';source.textContent=item.source==='p2p'?'P2P live':'cloudinary';const typ=document.createElement('span');typ.className='type-badge';typ.textContent=isVideo?'VIDEO':'PHOTO';card.append(media,source,typ,del);root.appendChild(card)}if(!list.length){const empty=document.createElement('p');empty.style.gridColumn='1/-1';empty.style.color='var(--muted)';empty.textContent='No '+(currentFilter==='videos'?'videos':'photos')+' loaded yet.';root.appendChild(empty)}}
function waitForDeleteAck(req,id){return new Promise(resolve=>{const timeout=setTimeout(()=>{if(pendingDelete&&pendingDelete.requestId===req){pendingDelete=null;resolve({deleted:false,error:'Child did not confirm deletion'})}},15000);pendingDelete={requestId:req,id,resolve:d=>{clearTimeout(timeout);pendingDelete=null;resolve(d)}}})}
async function deleteItem(item){if(!confirm('Delete this item from the child phone and synced copies?'))return;initSocket();if(!socket||!socket.connected)return setStatus('Child device is offline; deletion was not sent','var(--danger)');const req=crypto.randomUUID();setStatus('Deleting original from child phone…');debug('delete request sent',{id:item.id,requestId:req,source:item.source});const ackPromise=waitForDeleteAck(req,item.id);socket.emit('gallery-delete',{target:deviceId,id:item.id,requestId:req,publicId:item.publicId||'',resourceType:item.resourceType||((item.mime||'').startsWith('video/')?'video':'image')});const ack=await ackPromise;const sourceOk=ack&&ack.sourceDeleted===true;const cloudOk=!item.publicId||ack&&ack.cloudinaryDeleted===true;if(!sourceOk||!cloudOk){debug('delete incomplete',ack);return setStatus('Delete incomplete: '+(ack&&ack.error||'child did not confirm'),'var(--danger)')}allPhotos=allPhotos.filter(x=>x.id!==item.id);await dbDelete(item.id);if(item.url&&item.url.startsWith('blob:'))URL.revokeObjectURL(item.url);renderGallery();setStatus('Deleted from child phone'+(ack.cloudinaryDeleted?' and Cloudinary':'')+'.','var(--ok)')}
function resetGalleryHistory(){if(!confirm('Clear only this parent browser cache? Child files will not be deleted.'))return;dbClear();allPhotos=[];renderGallery();setStatus('Parent browser cache cleared; child files remain','var(--ok)');debug('parent cache cleared')}
function openModal(item){const box=document.getElementById('modalMedia');box.innerHTML='';const isVideo=itemType(item)==='videos';const media=isVideo?document.createElement('video'):document.createElement('img');media.className='modal-content';media.src=item.url;if(isVideo){media.controls=true;media.autoplay=true;media.playsInline=true}box.appendChild(media);document.getElementById('myModal').style.display='block';const dl=document.getElementById('downloadLink');dl.href=item.url;dl.download=item.name||('gallery-'+Date.now())}
function closeModal(){const media=document.querySelector('#modalMedia video');if(media)media.pause();document.getElementById('myModal').style.display='none';document.getElementById('modalMedia').innerHTML=''}
window.onclick=e=>{if(e.target===document.getElementById('myModal'))closeModal()};requestPersistentStorage();updateStorageInfo();if(deviceId)loadGallery('images',true);else setStatus('Device ID missing','var(--danger)');
</script>
</body>
</html>
