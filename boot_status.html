<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boot Status</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a0f;color:#e2e8f0;min-height:100vh;padding-bottom:40px}
.header{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#0a0a0f 0%,rgba(10,10,15,0.95) 100%);backdrop-filter:blur(12px);padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06)}
.header a{color:#a78bfa;text-decoration:none;font-size:1.2rem;padding:4px}
.header h1{font-size:1.05rem;font-weight:600;flex:1;background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{background:linear-gradient(135deg,#7c3aed,#0ea5e9);color:#fff;border:none;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:.8rem;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(0.95)}

.container{max-width:600px;margin:0 auto;padding:16px}

/* Summary Card */
.summary{background:linear-gradient(135deg,rgba(124,58,237,0.12),rgba(14,165,233,0.08));border:1px solid rgba(124,58,237,0.2);border-radius:16px;padding:16px;margin-bottom:20px}
.summary-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.summary-title{font-size:.75rem;color:#94a3b8;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.summary-status{font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:20px}
.status-ok{background:rgba(34,197,94,0.15);color:#22c55e}
.status-err{background:rgba(239,68,68,0.15);color:#ef4444}
.status-warn{background:rgba(245,158,11,0.15);color:#f59e0b}
.status-info{background:rgba(14,165,233,0.15);color:#0ea5e9}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary-item{background:rgba(255,255,255,0.03);border-radius:10px;padding:10px}
.summary-item .label{font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.summary-item .value{font-size:.85rem;font-weight:600;color:#e2e8f0;word-break:break-all}

/* Session Group */
.session-group{margin-bottom:20px}
.session-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:10px;border:1px solid rgba(255,255,255,0.05)}
.session-dot{width:8px;height:8px;border-radius:50%;background:#a78bfa;flex-shrink:0}
.session-id{font-size:.7rem;color:#94a3b8;font-family:monospace;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-time{font-size:.7rem;color:#64748b}

/* Timeline */
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(180deg,rgba(124,58,237,0.3),rgba(14,165,233,0.1))}
.event{position:relative;margin-bottom:10px}
.event-dot{position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;border:2px solid;background:#0a0a0f}
.dot-success{border-color:#22c55e}
.dot-error{border-color:#ef4444}
.dot-warning{border-color:#f59e0b}
.dot-info{border-color:#0ea5e9}
.event-card{background:#12121a;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;transition:border-color 0.2s}
.event-card:hover{border-color:rgba(124,58,237,0.3)}
.event-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.event-service{font-size:.8rem;font-weight:600;color:#e2e8f0;display:flex;align-items:center;gap:6px}
.event-service i{font-size:.7rem;color:#a78bfa}
.event-badge{font-size:.6rem;font-weight:700;padding:2px 8px;border-radius:12px;text-transform:uppercase;letter-spacing:.5px}
.badge-success{background:rgba(34,197,94,0.12);color:#22c55e}
.badge-error{background:rgba(239,68,68,0.12);color:#ef4444}
.badge-warning{background:rgba(245,158,11,0.12);color:#f59e0b}
.event-type{font-size:.65rem;color:#64748b;background:rgba(255,255,255,0.04);padding:2px 6px;border-radius:6px;display:inline-block;margin-bottom:6px}
.event-msg{font-size:.78rem;color:#94a3b8;line-height:1.4}
.event-time{font-size:.65rem;color:#475569;margin-top:6px;display:flex;align-items:center;gap:4px}

/* Loading & Empty */
.loading{text-align:center;padding:60px 20px;color:#64748b}
.loading i{font-size:2rem;margin-bottom:12px;display:block;color:#a78bfa;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:0.4}50%{opacity:1}}
.empty{text-align:center;padding:60px 20px;color:#64748b}
.empty i{font-size:2.5rem;margin-bottom:12px;display:block;color:#334155}
.empty p{font-size:.85rem}

@media(max-width:400px){
  .summary-grid{grid-template-columns:1fr}
  .container{padding:12px}
}
</style>
</head>
<body>
<div class="header">
  <a href="javascript:history.back()"><i class="fa-solid fa-arrow-left"></i></a>
  <h1><i class="fa-solid fa-power-off"></i> Boot Status</h1>
  <button class="btn" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Refresh</button>
</div>
<div class="container" id="content">
  <div class="loading"><i class="fa-solid fa-spinner"></i>Loading boot events...</div>
</div>

<script>
const DEVICE_ID = new URLSearchParams(location.search).get('id') || localStorage.getItem('monitoring_id') || '';
const API = 'https://webrtc-screen.onrender.com';

function timeAgo(ts) {
  if (!ts) return '';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  const now = Date.now();
  const diff = now - d.getTime();
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function formatTime(ts) {
  if (!ts) return '';
  const d = typeof ts === 'number' ? new Date(ts) : new Date(ts);
  return d.toLocaleString('en-IN', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function statusClass(s) {
  const st = (s || '').toUpperCase();
  if (st === 'SUCCESS') return 'success';
  if (st === 'ERROR') return 'error';
  if (st === 'WARNING') return 'warning';
  return 'info';
}

function serviceIcon(svc) {
  const s = (svc || '').toLowerCase();
  if (s.includes('boot')) return 'fa-power-off';
  if (s.includes('service') || s.includes('background')) return 'fa-cogs';
  if (s.includes('socket') || s.includes('network')) return 'fa-network-wired';
  if (s.includes('receiver')) return 'fa-broadcast-tower';
  if (s.includes('audio') || s.includes('mic')) return 'fa-microphone';
  if (s.includes('location')) return 'fa-location-dot';
  return 'fa-circle-check';
}

async function loadData() {
  const el = document.getElementById('content');
  if (!DEVICE_ID) { el.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Device ID missing</p></div>'; return; }

  el.innerHTML = '<div class="loading"><i class="fa-solid fa-spinner"></i>Loading boot events...</div>';

  try {
    const res = await fetch(API + '/api/boot-events/' + encodeURIComponent(DEVICE_ID) + '?limit=200&t=' + Date.now());
    const events = await res.json();

    if (!Array.isArray(events) || events.length === 0) {
      el.innerHTML = '<div class="empty"><i class="fa-solid fa-power-off"></i><p>No boot events found.<br>Phone restart hone pe data yahan dikhega.</p></div>';
      return;
    }

    // Sort newest first
    events.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

    // Group by bootSessionId
    const sessions = {};
    for (const ev of events) {
      const sid = ev.bootSessionId || 'unknown';
      if (!sessions[sid]) sessions[sid] = [];
      sessions[sid].push(ev);
    }

    // Find latest session for summary
    const sessionIds = Object.keys(sessions);
    const latestSession = sessionIds[0];
    const latestEvents = sessions[latestSession] || [];
    latestEvents.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

    const hasError = latestEvents.some(e => (e.status || '').toUpperCase() === 'ERROR');
    const hasWarning = latestEvents.some(e => (e.status || '').toUpperCase() === 'WARNING');
    const allSuccess = latestEvents.every(e => (e.status || '').toUpperCase() === 'SUCCESS');
    const overallStatus = hasError ? 'ERROR' : hasWarning ? 'WARNING' : allSuccess ? 'SUCCESS' : 'RUNNING';

    const firstEvent = latestEvents[0];
    const lastEvent = latestEvents[latestEvents.length - 1];
    const bootTime = firstEvent ? formatTime(firstEvent.timestamp) : '';
    const totalEvents = latestEvents.length;

    let html = '';

    // Summary card
    html += '<div class="summary">';
    html += '<div class="summary-top">';
    html += '<span class="summary-title">Latest Boot Session</span>';
    html += '<span class="summary-status status-' + statusClass(overallStatus) + '">' + overallStatus + '</span>';
    html += '</div>';
    html += '<div class="summary-grid">';
    html += '<div class="summary-item"><div class="label">Boot Time</div><div class="value">' + bootTime + '</div></div>';
    html += '<div class="summary-item"><div class="label">Events</div><div class="value">' + totalEvents + ' services checked</div></div>';
    html += '<div class="summary-item"><div class="label">Session ID</div><div class="value" style="font-size:.7rem;font-family:monospace">' + (latestSession || 'N/A') + '</div></div>';
    html += '<div class="summary-item"><div class="label">Last Updated</div><div class="value">' + timeAgo(lastEvent ? lastEvent.timestamp : null) + '</div></div>';
    html += '</div></div>';

    // Render each session group (newest first)
    for (const sid of sessionIds) {
      const sEvents = sessions[sid];
      sEvents.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
      const first = sEvents[sEvents.length - 1];

      html += '<div class="session-group">';
      html += '<div class="session-header">';
      html += '<div class="session-dot"></div>';
      html += '<span class="session-id">' + sid + '</span>';
      html += '<span class="session-time">' + timeAgo(first ? first.timestamp : null) + '</span>';
      html += '</div>';
      html += '<div class="timeline">';

      for (const ev of sEvents) {
        const sc = statusClass(ev.status);
        const icon = serviceIcon(ev.serviceName);
        html += '<div class="event">';
        html += '<div class="event-dot dot-' + sc + '"></div>';
        html += '<div class="event-card">';
        html += '<div class="event-top">';
        html += '<span class="event-service"><i class="fa-solid ' + icon + '"></i> ' + (ev.serviceName || 'Unknown') + '</span>';
        html += '<span class="event-badge badge-' + sc + '">' + (ev.status || 'UNKNOWN') + '</span>';
        html += '</div>';
        html += '<span class="event-type">' + (ev.eventType || 'EVENT') + '</span>';
        if (ev.message) html += '<div class="event-msg">' + ev.message + '</div>';
        html += '<div class="event-time"><i class="fa-regular fa-clock"></i> ' + formatTime(ev.timestamp) + '</div>';
        html += '</div></div>';
      }

      html += '</div></div>';
    }

    el.innerHTML = html;
  } catch (e) {
    el.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Failed to load boot events.<br>' + e.message + '</p></div>';
  }
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
